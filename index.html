
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon/Favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/Favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinSync - Portfolio Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'flash-green': 'flash-green 0.7s ease-out',
              'flash-red': 'flash-red 0.7s ease-out',
            },
            keyframes: {
              'flash-green': {
                '0%, 100%': { backgroundColor: 'transparent' },
                '50%': { backgroundColor: 'rgba(34, 197, 94, 0.3)' },
              },
              'flash-red': {
                '0%, 100%': { backgroundColor: 'transparent' },
                '50%': { backgroundColor: 'rgba(239, 68, 68, 0.3)' },
              },
            }
          },
        },
      }
    </script>
    <style>
      /* Ensure proper background on html and body */
      html {
        background-color: #ffffff; /* white */
        min-height: 100vh;
      }
      
      html.dark {
        background-color: #000000; /* pure black */
      }
      
      body {
        min-height: 100vh;
        background-color: #ffffff; /* white */
      }
      
      body.dark {
        background-color: #000000; /* pure black */
      }
      
      /* Hide scrollbar for Chrome, Safari and Opera */
      .overflow-y-auto::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .overflow-y-auto {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Hide page breaks in prose content */
      .prose :where(hr):not(:where([class~="not-prose"] *)) {
        display: none;
      }
      
      /* Prevent page breaks */
      @media print {
        * {
          page-break-inside: avoid;
        }
      }
      
      /* Hide any pagination elements */
      [class*="page-"],
      [class*="pagination"],
      .page-break,
      .pagebreak {
        display: none !important;
      }
    </style>
</head>
  <body class="font-sans bg-white dark:bg-black min-h-screen">
    <div id="root" class="min-h-screen"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
